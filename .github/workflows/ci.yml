name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Linux is pinned: the keyring setup below is known to work on 24.04.
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run bundle
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      # End-to-end tests drive the built app against the local mock provider.
      # The app stores keys only in a real keyring, so the Linux run needs one:
      # a D-Bus session with gnome-keyring unlocked, inside a virtual display.
      - name: End-to-end (Linux, virtual display and keyring)
        if: runner.os == 'Linux'
        env:
          # Chromium chooses its key-storage backend from the desktop session name.
          XDG_CURRENT_DESKTOP: GNOME
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb gnome-keyring dbus-x11 libsecret-tools
          xvfb-run --auto-servernum dbus-run-session -- bash -ec '
            echo -n "ci-keyring" | gnome-keyring-daemon --unlock --components=secrets
            sleep 1
            echo -n "probe" | secret-tool store --label=probe relay probe
            test "$(secret-tool lookup relay probe)" = "probe"
            echo "keyring ready"
            npx playwright test
          '
      - name: End-to-end
        if: runner.os != 'Linux'
        run: npx playwright test
      - run: npm run notices
      - name: Package (unsigned)
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify the packaged build (fuses, startup, run-as-node, ASAR integrity)
        if: runner.os != 'Linux'
        run: npm run verify:package
      - uses: actions/upload-artifact@v4
        with:
          name: relay-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: ignore
