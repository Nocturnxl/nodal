name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Linux is pinned: the keyring setup below is known to work on 24.04.
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run bundle
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      # End-to-end tests drive the built app against the local mock provider.
      # The app stores keys only in a real keyring, so the Linux run needs one:
      # a D-Bus session with gnome-keyring unlocked, inside a virtual display.
      - name: End-to-end (Linux, virtual display and keyring)
        if: runner.os == 'Linux'
        env:
          # The test driver starts Chromium with --password-store=basic; name the real backend.
          NODAL_PASSWORD_STORE: gnome-libsecret
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb gnome-keyring dbus-x11 libsecret-tools
          xvfb-run --auto-servernum dbus-run-session -- bash -ec '
            echo -n "ci-keyring" | gnome-keyring-daemon --unlock --components=secrets
            sleep 1
            echo -n "probe" | secret-tool store --label=probe nodal probe
            test "$(secret-tool lookup nodal probe)" = "probe"
            echo "keyring ready"
            node scripts/diagnose-keyring.mjs
            npx playwright test
          '
      - name: End-to-end
        if: runner.os != 'Linux'
        run: npx playwright test
      - name: Keep the page snapshots of failed end-to-end tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore
      - run: npm run notices
      - name: Package (unsigned)
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify the packaged build (fuses, startup, run-as-node, ASAR integrity)
        if: runner.os != 'Linux'
        run: npm run verify:package
      - name: Verify the packaged build (Linux, virtual display)
        if: runner.os == 'Linux'
        run: |
          # An unpacked build has no installer to set up Chromium's sandbox helper; do what a package install does.
          sudo chown root:root dist/linux-unpacked/chrome-sandbox
          sudo chmod 4755 dist/linux-unpacked/chrome-sandbox
          xvfb-run --auto-servernum npm run verify:package
      - uses: actions/upload-artifact@v4
        with:
          name: nodal-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: ignore

  release:
    # Pushing a tag such as v0.1.0 turns the installers built above into a draft
    # GitHub release with a checksum file. A person reviews and publishes it.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: nodal-*
          path: installers
          merge-multiple: true
      - name: Checksums
        run: |
          cd installers
          ls -la
          sha256sum NODAL-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" installers/NODAL-* installers/SHA256SUMS.txt \
            --draft --verify-tag \
            --title "NODAL ${GITHUB_REF_NAME#v}" \
            --notes-file "docs/release-notes/${GITHUB_REF_NAME}.md"
