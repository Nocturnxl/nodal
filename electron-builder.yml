appId: app.nodal.desktop
productName: NODAL
copyright: NODAL
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - '!out/.bundled-packages.json'
  - package.json
extraResources:
  - from: THIRD-PARTY-NOTICES.md
    to: THIRD-PARTY-NOTICES.md
  - from: build/icon.png
    to: icon.png
asar: true
# better-sqlite3 ships prebuilt N-API binaries that load in Node and Electron
# alike, so nothing needs compiling (or downloading) at packaging time.
npmRebuild: false
# Native modules cannot load from inside the archive.
asarUnpack:
  - node_modules/better-sqlite3-multiple-ciphers/**

# Electron fuses, flipped at packaging time (spec section 5). With these set
# the binary cannot be repurposed as a generic Node runtime, ignores
# NODE_OPTIONS and --inspect, loads code only from the ASAR, and validates the
# ASAR against the hash embedded in the executable.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
  enableCookieEncryption: true
  grantFileProtocolExtraPrivileges: false

win:
  icon: build/icon.png
  target:
    - nsis
  # Signed when a certificate is configured (CSC_LINK / CSC_KEY_PASSWORD or
  # win.signtoolOptions). Unsigned builds work but show a SmartScreen warning
  # on other machines.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

mac:
  icon: build/icon.png
  target:
    - dmg
  category: public.app-category.productivity
  hardenedRuntime: true

linux:
  icon: build/icon.png
  target:
    - AppImage
    - deb
  # Published in the .deb's metadata as the package maintainer.
  maintainer: NODAL <150420308+Nocturnxl@users.noreply.github.com>
  category: Utility

# No update feed is configured: releases are manual downloads until one is
# added here (GitHub release or a static host). The in-app update check is a
# no-op without it.
publish: null
